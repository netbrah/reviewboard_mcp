name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_environment:
        description: 'Environment to deploy to'
        required: false
        type: choice
        options:
          - none
          - staging
          - production

env:
  NODE_VERSION: '18'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Check build artifacts
        run: |
          ls -la build/
          file build/index.js build/index-http.js
      
      - name: Run linter (if configured)
        run: npm run lint || echo "No linter configured"
        continue-on-error: true
      
      # Note: Tests require ReviewBoard credentials
      # Uncomment when REVIEWBOARD_API_TOKEN secret is configured
      # - name: Run tests
      #   env:
      #     REVIEWBOARD_BASE_URL: ${{ secrets.REVIEWBOARD_BASE_URL }}
      #     REVIEWBOARD_API_TOKEN: ${{ secrets.REVIEWBOARD_API_TOKEN }}
      #   run: npm test
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/
          retention-days: 7

  # Job 2: Build Docker Image
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
      
      - name: Generate image summary
        run: |
          echo "## Docker Image Built Successfully :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # Job 3: Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Job 4: Deploy to Staging (optional)
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'staging')
    environment:
      name: staging
      url: https://mcp-reviewboard-staging.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add actual deployment commands here
          # Examples:
          # - kubectl set image deployment/reviewboard-mcp reviewboard-mcp=$IMAGE
          # - helm upgrade reviewboard-mcp ./chart --set image.tag=$TAG
          # - ansible-playbook deploy-staging.yml
      
      - name: Register with LiteLLM (Staging)
        if: false  # Enable when ready
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY_STAGING }}
        run: |
          curl -X POST 'https://llm-proxy-api-staging.example.com/v1/mcp/server' \
            -H 'Content-Type: application/json' \
            -H "x-litellm-api-key: $LITELLM_API_KEY" \
            -d @- <<EOF
          {
            "server_name": "reviewboard_staging",
            "alias": "reviewboard-staging",
            "description": "ReviewBoard MCP Server - Staging",
            "transport": "sse",
            "auth_type": "bearer_token",
            "url": "https://mcp-reviewboard-staging.example.com/mcp/",
            "mcp_access_groups": ["reviewboard", "staging"],
            "extra_headers": ["X-ReviewBoard-URL"]
          }
          EOF
      
      - name: Health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://mcp-reviewboard-staging.example.com/health || exit 1

  # Job 5: Deploy to Production (manual approval required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-test, build-docker, security-scan]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_environment == 'production'))
    environment:
      name: production
      url: https://mcp-reviewboard.ai.eng.netapp.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          echo "Image: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          # Add actual deployment commands here
          # Examples:
          # - kubectl set image deployment/reviewboard-mcp reviewboard-mcp=$IMAGE
          # - helm upgrade reviewboard-mcp ./chart --set image.tag=$TAG --namespace production
      
      - name: Register with LiteLLM (Production)
        if: false  # Enable when ready
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY_PRODUCTION }}
        run: |
          curl -X POST 'https://llm-proxy-api.ai.eng.netapp.com/v1/mcp/server' \
            -H 'Content-Type: application/json' \
            -H "x-litellm-api-key: $LITELLM_API_KEY" \
            -d @- <<EOF
          {
            "server_name": "reviewboard_netapp",
            "alias": "reviewboard",
            "description": "NetApp ReviewBoard MCP server - Natural language interface for code reviews",
            "transport": "sse",
            "auth_type": "bearer_token",
            "url": "https://mcp-reviewboard.ai.eng.netapp.com/mcp/",
            "mcp_info": {
              "logo_url": "app/static/icons/ReviewBoard.png",
              "token_prefix": "Bearer",
              "requires_username": false,
              "source": "ReviewBoard",
              "server_name": "reviewboard_netapp",
              "description": "Natural language interface for ReviewBoard code reviews"
            },
            "mcp_access_groups": ["reviewboard", "engineering"],
            "extra_headers": ["X-ReviewBoard-URL"]
          }
          EOF
      
      - name: Health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f https://mcp-reviewboard.ai.eng.netapp.com/health || exit 1
      
      - name: Verify tools registration
        if: false  # Enable when ready
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY_PRODUCTION }}
        run: |
          echo "Verifying tools are registered..."
          curl -X GET 'https://llm-proxy-api.ai.eng.netapp.com/mcp-rest/tools/list' \
            -H "x-litellm-api-key: $LITELLM_API_KEY" | jq '.tools | length'
      
      - name: Create deployment summary
        run: |
          echo "## Production Deployment Complete :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://mcp-reviewboard.ai.eng.netapp.com" >> $GITHUB_STEP_SUMMARY
          echo "**Health:** https://mcp-reviewboard.ai.eng.netapp.com/health" >> $GITHUB_STEP_SUMMARY

  # Job 6: Create Release (on tag push)
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, build-docker]
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate changelog
        id: changelog
        run: |
          echo "## What's Changed" > CHANGELOG.md
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
