name: Test Suite

on:
  push:
    branches: [ main, develop, 'copilot/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'

jobs:
  test-stdio:
    name: Test stdio Mode
    runs-on: ubuntu-latest
    
    # Use RHEL 9 UBI container for build environment
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      options: --user root
    
    # Only run if ReviewBoard credentials are configured
    if: secrets.REVIEWBOARD_API_TOKEN != ''
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install git (required for actions/checkout in RHEL container)
        run: |
          yum install -y git tar gzip
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run stdio tests
        env:
          REVIEWBOARD_BASE_URL: ${{ secrets.REVIEWBOARD_BASE_URL }}
          REVIEWBOARD_API_TOKEN: ${{ secrets.REVIEWBOARD_API_TOKEN }}
          TEST_REVIEW_ID: 858846
          TEST_REVIEW_ID_ALT: 882166
        run: npm test
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-stdio
          path: test-results/
          retention-days: 7
  
  test-http:
    name: Test HTTP Mode
    runs-on: ubuntu-latest
    
    # Use RHEL 9 UBI container for build environment
    container:
      image: registry.access.redhat.com/ubi9/nodejs-20:latest
      options: --user root
    
    # Only run if ReviewBoard credentials are configured
    if: secrets.REVIEWBOARD_API_TOKEN != ''
    
    services:
      reviewboard-mcp:
        # This will be replaced with actual image once built
        # image: ghcr.io/${{ github.repository }}:${{ github.sha }}
        # For now, we'll build and run locally
        ports:
          - 3000:3000
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install git and curl (required in RHEL container)
        run: |
          yum install -y git tar gzip curl jq
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Start HTTP server in background
        env:
          PORT: 3000
          HOST: 0.0.0.0
        run: |
          npm run start:http &
          echo $! > server.pid
          sleep 5
      
      - name: Test health endpoint
        run: |
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/ | jq .
      
      - name: Test SSE endpoint
        env:
          REVIEWBOARD_BASE_URL: ${{ secrets.REVIEWBOARD_BASE_URL }}
          REVIEWBOARD_API_TOKEN: ${{ secrets.REVIEWBOARD_API_TOKEN }}
        run: |
          # Basic connectivity test
          timeout 10s curl -N \
            -H "Authorization: Bearer $REVIEWBOARD_API_TOKEN" \
            -H "X-ReviewBoard-URL: $REVIEWBOARD_BASE_URL" \
            http://localhost:3000/mcp/sse || echo "SSE connection established"
      
      - name: Stop HTTP server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      - name: Upload HTTP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-http
          path: test-results/
          retention-days: 7

  # Integration Tests - Docker only (no LiteLLM access)
  test-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js (for local build before Docker)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project (required for RHEL UBI Dockerfile)
        run: npm run build
      
      - name: Build Docker image (RHEL 9 UBI based)
        run: docker build -t reviewboard-mcp:test .
      
      - name: Run container
        run: |
          docker run -d \
            --name reviewboard-mcp-test \
            -p 3000:3000 \
            reviewboard-mcp:test
          sleep 10
      
      - name: Test container health
        run: |
          curl -f http://localhost:3000/health
          curl -f http://localhost:3000/ | jq .
      
      - name: Display registration payload (for manual use)
        run: |
          cat > registration.json <<EOF
          {
            "server_name": "reviewboard_netapp",
            "alias": "reviewboard",
            "description": "NetApp ReviewBoard MCP server",
            "transport": "sse",
            "auth_type": "bearer_token",
            "url": "https://mcp-reviewboard.ai.eng.netapp.com/mcp/",
            "mcp_access_groups": ["reviewboard", "engineering"],
            "extra_headers": ["X-ReviewBoard-URL"]
          }
          EOF
          
          echo "LiteLLM registration payload (for manual registration):"
          cat registration.json | jq .
          echo ""
          echo "NOTE: LiteLLM registration must be done manually."
          echo "See docs/DEPLOYMENT.md for instructions."
          echo "Would register with LiteLLM:"
          cat registration.json | jq .
      
      - name: Cleanup
        if: always()
        run: |
          docker stop reviewboard-mcp-test || true
          docker rm reviewboard-mcp-test || true
      
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-integration
          path: test-results/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-stdio, test-http]
    if: always()
    
    steps:
      - name: Generate test summary
        run: |
          echo "## Test Results :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| stdio Mode | ${{ needs.test-stdio.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Mode  | ${{ needs.test-http.result }} |" >> $GITHUB_STEP_SUMMARY
